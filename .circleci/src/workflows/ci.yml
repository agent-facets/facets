jobs:
  - check:
      context:
        - turbo-cache
        - slack-secrets
      filters:
        branches:
          ignore:
            - main
      post-steps:
        - notify-failure
  - build-binaries:
      requires:
        - check
      context:
        - turbo-cache
      filters:
        branches:
          ignore:
            - main
      post-steps:
        - notify-failure
      matrix:
        parameters:
          target:
            - linux-arm64
            - linux-x64
            - linux-x64-baseline
            - linux-arm64-musl
            - linux-x64-musl
            - linux-x64-baseline-musl
            - darwin-arm64
            - darwin-x64
            - darwin-x64-baseline
            - windows-arm64
            - windows-x64
            - windows-x64-baseline
  - collect-binaries:
      requires:
        - build-binaries
      filters:
        branches:
          ignore:
            - main
  - changesets:
      context:
        - release
        - slack-secrets
      filters:
        branches:
          only:
            - main
      post-steps:
        - notify-failure
  - tag-release:
      context:
        - release
        - slack-secrets
      filters:
        branches:
          only:
            - main
      post-steps:
        - notify-failure

