jobs:
  - check:
      context:
        - turbo-cache
        - slack-secrets
      filters:
        branches:
          ignore:
            - main
      post-steps:
        - notify-failure
  - build-binaries:
      requires:
        - check
      context:
        - turbo-cache
      filters:
        branches:
          ignore:
            - main
      post-steps:
        - notify-failure
  - changesets:
      context:
        - release
        - slack-secrets
      filters:
        branches:
          only:
            - main
      post-steps:
        - notify-failure
  - tag-release:
      context:
        - release
        - slack-secrets
      filters:
        branches:
          only:
            - main
      post-steps:
        - notify-failure

