jobs:
  - check:
      context: slack-secrets
      post-steps:
        - notify-failure
  - changesets:
      requires:
        - check
      context:
        - release
        - slack-secrets
      filters:
        branches:
          only:
            - main
      post-steps:
        - notify-failure
  - release:
      requires:
        - check
      context:
        - release
        - slack-secrets
      filters:
        branches:
          only:
            - release
      post-steps:
        - notify-failure
        - notify-success
