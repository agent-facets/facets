docker:
  - image: cimg/base:current
resource_class: small
environment:
  LEFTHOOK: "0"
steps:
  - setup-mise
  - run:
      name: Check
      command: bun run check
  - store_test_results:
      path: test-results
  - run:
      name: Changesets
      command: bun scripts/ci-changesets.ts
  - run:
      name: Tag Release
      command: bun scripts/ci-tag-release.ts
  - notify-failure
