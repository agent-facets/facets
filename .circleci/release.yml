commands:
    notify-failure:
        steps:
            - slack/notify:
                branch_pattern: main
                channel: C0AQVA6UB38, C0AQFU5S4PR
                event: fail
                template: basic_fail_1
    notify-success:
        steps:
            - slack/notify:
                channel: C0AQVA6UB38
                event: pass
                template: basic_success_1
    setup-mise:
        steps:
            - checkout
            - run:
                command: |
                    curl https://mise.run | sh
                    echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
                name: Install mise
            - run:
                command: mise install --yes
                name: Install tools
            - run:
                command: bun install --frozen-lockfile
                name: Install dependencies
jobs:
    release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/ci-release.ts
                name: Release
orbs:
    slack: circleci/slack@6
version: 2.1
workflows:
    release:
        jobs:
            - release:
                context:
                    - release
                    - slack-secrets
                filters:
                    branches:
                        ignore:
                            - /.*/
                    tags:
                        only:
                            - /^@agent-facets\/.+@\d+\..+/
                            - /^agent-facets@\d+\..+/
                post-steps:
                    - notify-failure
                    - notify-success

