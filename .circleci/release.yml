commands:
    notify-failure:
        steps:
            - run:
                command: bun scripts/ci-notify-failure.ts
                name: Notify failure
                when: on_fail
    setup-mise:
        steps:
            - checkout
            - run:
                command: |
                    curl https://mise.run | sh
                    echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
                name: Install mise
            - run:
                command: mise install --yes
                name: Install tools
            - restore_cache:
                keys:
                    - v1-deps-{{ checksum "bun.lock" }}
                    - v1-deps-
            - run:
                command: bun install --frozen-lockfile
                name: Install dependencies
            - save_cache:
                key: v1-deps-{{ checksum "bun.lock" }}
                paths:
                    - node_modules
                    - ~/.bun/install/cache
jobs:
    build-cli:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/build-facet-cli.ts
                name: Build CLI binaries
            - persist_to_workspace:
                paths:
                    - packages/cli/dist
                root: .
            - notify-failure
    finalize-cli:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        resource_class: small
        steps:
            - setup-mise
            - attach_workspace:
                at: .
            - run:
                command: bun scripts/ci-release-finalize.ts
                name: Finalize release
            - notify-failure
    publish-platform:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        parameters:
            target:
                type: string
        resource_class: small
        steps:
            - setup-mise
            - attach_workspace:
                at: .
            - run:
                command: bun scripts/publish-single.ts << parameters.target >>
                name: Publish << parameters.target >> to staging
            - notify-failure
    release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/ci-release.ts
                name: Release
            - notify-failure
version: 2.1
workflows:
    release:
        jobs:
            - release:
                context:
                    - turbo-cache
                    - bot-context
                    - slack-secrets
                filters:
                    branches:
                        ignore:
                            - /.*/
                    tags:
                        only:
                            - /^@agent-facets\/.+@\d+\..+/
    release-cli:
        jobs:
            - build-cli:
                context:
                    - turbo-cache
                    - bot-context
                    - slack-secrets
                filters:
                    branches:
                        ignore:
                            - /.*/
                    tags:
                        only:
                            - /^agent-facets@\d+\..+/
            - publish-platform:
                context:
                    - turbo-cache
                    - bot-context
                    - slack-secrets
                filters:
                    branches:
                        ignore:
                            - /.*/
                    tags:
                        only:
                            - /^agent-facets@\d+\..+/
                matrix:
                    parameters:
                        target:
                            - cli-darwin-arm64
                            - cli-darwin-x64
                            - cli-darwin-x64-baseline
                            - cli-linux-arm64
                            - cli-linux-arm64-musl
                            - cli-linux-x64
                            - cli-linux-x64-baseline
                            - cli-linux-x64-baseline-musl
                            - cli-linux-x64-musl
                            - cli-windows-arm64
                            - cli-windows-x64
                            - cli-windows-x64-baseline
                requires:
                    - build-cli
            - finalize-cli:
                context:
                    - turbo-cache
                    - bot-context
                    - slack-secrets
                filters:
                    branches:
                        ignore:
                            - /.*/
                    tags:
                        only:
                            - /^agent-facets@\d+\..+/
                requires:
                    - publish-platform

