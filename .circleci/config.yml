commands:
    notify-failure:
        steps:
            - slack/notify:
                branch_pattern: main
                channel: C0AQVA6UB38, C0AQFU5S4PR
                event: fail
                template: basic_fail_1
    notify-success:
        steps:
            - slack/notify:
                channel: C0AQVA6UB38
                event: pass
                template: basic_success_1
    setup-mise:
        steps:
            - checkout
            - run:
                command: |
                    curl https://mise.run | sh
                    echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
                name: Install mise
            - run:
                command: mise install --yes
                name: Install tools
            - restore_cache:
                keys:
                    - v1-deps-{{ checksum "bun.lock" }}
                    - v1-deps-
            - run:
                command: bun install --frozen-lockfile
                name: Install dependencies
            - save_cache:
                key: v1-deps-{{ checksum "bun.lock" }}
                paths:
                    - node_modules
                    - ~/.bun/install/cache
jobs:
    build-binaries:
        docker:
            - image: cimg/base:current
        parameters:
            target:
                type: string
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/build-cli.ts --target << parameters.target >>
                name: Build << parameters.target >>
            - persist_to_workspace:
                paths:
                    - '@agent-facets/cli-<< parameters.target >>'
                root: packages/cli/dist
    changesets:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/ci-changesets.ts
                name: Changesets
    check:
        docker:
            - image: cimg/base:current
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun run check
                name: Check
            - store_test_results:
                path: test-results
    collect-binaries:
        docker:
            - image: cimg/base:current
        resource_class: small
        steps:
            - attach_workspace:
                at: packages/cli/dist
            - run:
                command: ls -la packages/cli/dist/@agent-facets/ || echo "No binaries found"
                name: List collected binaries
    release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/ci-release.ts
                name: Release
    tag-release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/ci-tag-release.ts
                name: Tag Release
orbs:
    slack: circleci/slack@6
version: 2.1
workflows:
    ci:
        jobs:
            - check:
                context:
                    - turbo-cache
                    - slack-secrets
                filters:
                    branches:
                        ignore:
                            - main
                post-steps:
                    - notify-failure
            - build-binaries:
                context:
                    - turbo-cache
                filters:
                    branches:
                        ignore:
                            - main
                matrix:
                    parameters:
                        target:
                            - linux-arm64
                            - linux-x64
                            - linux-x64-baseline
                            - linux-arm64-musl
                            - linux-x64-musl
                            - linux-x64-baseline-musl
                            - darwin-arm64
                            - darwin-x64
                            - darwin-x64-baseline
                            - windows-arm64
                            - windows-x64
                            - windows-x64-baseline
                post-steps:
                    - notify-failure
                requires:
                    - check
            - collect-binaries:
                filters:
                    branches:
                        ignore:
                            - main
                requires:
                    - build-binaries
            - changesets:
                context:
                    - release
                    - slack-secrets
                filters:
                    branches:
                        only:
                            - main
                post-steps:
                    - notify-failure
            - tag-release:
                context:
                    - release
                    - slack-secrets
                filters:
                    branches:
                        only:
                            - main
                post-steps:
                    - notify-failure

