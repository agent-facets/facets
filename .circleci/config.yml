commands:
    notify-failure:
        steps:
            - slack/notify:
                branch_pattern: main,release
                channel: C0AQVA6UB38, C0AQFU5S4PR
                event: fail
                template: basic_fail_1
    notify-success:
        steps:
            - slack/notify:
                channel: C0AQVA6UB38
                event: pass
                template: basic_success_1
    setup-mise:
        steps:
            - checkout
            - run:
                command: |
                    curl https://mise.run | sh
                    echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
                name: Install mise
            - run:
                command: mise install --yes
                name: Install tools
            - restore_cache:
                keys:
                    - v1-deps-{{ checksum "bun.lock" }}
                    - v1-deps-
            - run:
                command: bun install --frozen-lockfile
                name: Install dependencies
            - save_cache:
                key: v1-deps-{{ checksum "bun.lock" }}
                paths:
                    - node_modules
                    - ~/.bun/install/cache
jobs:
    changesets:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/ci-changesets.ts
                name: Changesets
    check:
        docker:
            - image: cimg/base:current
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun run check
                name: Check
            - store_test_results:
                path: test-results
    release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/ci-release.ts
                name: Release
orbs:
    slack: circleci/slack@6
version: 2.1
workflows:
    ci:
        jobs:
            - check:
                context: slack-secrets
                post-steps:
                    - notify-failure
            - changesets:
                context:
                    - release
                    - slack-secrets
                filters:
                    branches:
                        only:
                            - main
                post-steps:
                    - notify-failure
                requires:
                    - check
            - release:
                context:
                    - release
                    - slack-secrets
                filters:
                    branches:
                        only:
                            - release
                post-steps:
                    - notify-failure
                    - notify-success
                requires:
                    - check

