commands:
    notify-failure:
        steps:
            - run:
                command: bun scripts/lib/notify-failure.ts
                name: Notify failure
                when: on_fail
    run-check:
        steps:
            - run:
                command: bun turbo check
                name: Check
    setup-mise:
        steps:
            - checkout
            - run:
                command: |
                    curl https://mise.run | sh
                    echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
                name: Install mise
            - run:
                command: mise install --yes
                name: Install tools
            - restore_cache:
                keys:
                    - v1-deps-{{ checksum "bun.lock" }}
                    - v1-deps-
            - run:
                command: bun install --frozen-lockfile
                name: Install dependencies
            - save_cache:
                key: v1-deps-{{ checksum "bun.lock" }}
                paths:
                    - node_modules
                    - ~/.bun/install/cache
jobs:
    check:
        docker:
            - image: cimg/base:current
        resource_class: medium
        steps:
            - setup-mise
            - run:
                command: cp packages/cli/turbo.ci.json packages/cli/turbo.json
                name: Disable CLI build cache
            - run-check
            - run:
                command: git checkout packages/cli/turbo.json
                name: Restore CLI turbo config
            - store_test_results:
                path: test-results
    main-pipeline:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
        resource_class: medium
        steps:
            - setup-mise
            - run-check
            - store_test_results:
                path: test-results
            - run:
                command: bun scripts/release/version.ts
                name: Version Changesets
            - run:
                command: bun scripts/release/tag.ts
                name: Tag Release
            - notify-failure
    release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun scripts/release/publish.ts
                name: Publish
            - notify-failure
version: 2.1
workflows:
    ci:
        jobs:
            - check:
                context:
                    - turbo-cache
                filters:
                    branches:
                        ignore:
                            - main
            - main-pipeline:
                context:
                    - turbo-cache
                    - bot-context
                    - slack-secrets
                filters:
                    branches:
                        only:
                            - main

