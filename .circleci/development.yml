commands:
    aws-oidc-setup:
        steps:
            - aws-cli/setup:
                region: us-east-1
                role_arn: ${AWS_ROLE_ARN}
    notify-failure:
        steps:
            - run:
                command: bun scripts/lib/notify-failure.ts
                name: Notify failure
                when: on_fail
    run-check:
        steps:
            - run:
                command: bun turbo check
                environment:
                    TURBO_CONCURRENCY: "1"
                name: Check
    setup-env:
        steps:
            - checkout
            - run:
                command: |
                    curl https://mise.run | sh
                    echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
                name: Install mise
            - run:
                command: mise install --yes
                name: Install tools
            - run:
                command: |
                    curl -fsSL https://agentfacets.io/install | bash
                    echo 'export PATH="$HOME/.facet/bin:$PATH"' >> "$BASH_ENV"
                name: Install facet CLI
            - run:
                command: facet adapter install opencode
                name: Install OpenCode adapter
            - restore_cache:
                keys:
                    - v1-deps-{{ checksum "bun.lock" }}
                    - v1-deps-
            - run:
                command: bun install --frozen-lockfile
                name: Install dependencies
            - save_cache:
                key: v1-deps-{{ checksum "bun.lock" }}
                paths:
                    - node_modules
                    - ~/.bun/install/cache
jobs:
    check:
        docker:
            - image: cimg/base:current
        resource_class: medium
        steps:
            - setup-env
            - run:
                command: cp packages/cli/turbo.ci.json packages/cli/turbo.json
                name: Disable CLI build cache
            - run:
                command: cp packages/adapters/opencode/turbo.ci.json packages/adapters/opencode/turbo.json
                name: Disable OpenCode adapter build cache
            - run:
                command: cp packages/adapters/claude-code/turbo.ci.json packages/adapters/claude-code/turbo.json
                name: Disable Claude Code adapter build cache
            - run:
                command: cp packages/adapters/codex/turbo.ci.json packages/adapters/codex/turbo.json
                name: Disable Codex adapter build cache
            - run-check
            - run:
                command: git checkout packages
                name: Restore Turbo configs
            - store_test_results:
                path: test-results
    main-pipeline:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
        resource_class: medium
        steps:
            - setup-env
            - run-check
            - store_test_results:
                path: test-results
            - run:
                command: bun scripts/release/version.ts
                name: Version Changesets
            - run:
                command: bun scripts/release/tag.ts
                name: Tag Release
            - notify-failure
    release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
        resource_class: small
        steps:
            - setup-env
            - run:
                command: bun scripts/release/publish.ts
                name: Publish
            - notify-failure
orbs:
    aws-cli: circleci/aws-cli@5.4.1
parameters:
    package:
        default: ""
        type: string
version: 2.1
workflows:
    ci:
        jobs:
            - check:
                context:
                    - turbo-cache
                    - github
                filters:
                    branches:
                        ignore:
                            - main
            - main-pipeline:
                context:
                    - turbo-cache
                    - bot-context
                    - slack-secrets
                    - github
                filters:
                    branches:
                        only:
                            - main
                serial-group: << pipeline.project.slug >>/main-pipeline

