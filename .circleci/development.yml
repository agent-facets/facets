commands:
    aws-oidc-setup:
        steps:
            - aws-cli/setup:
                region: us-east-1
                role_arn: ${AWS_ROLE_ARN}
    notify-failure:
        steps:
            - run:
                command: bun scripts/lib/notify-failure.ts
                name: Notify failure
                when: on_fail
    run-check:
        steps:
            - restore_cache:
                keys:
                    - v1-mint-{{ checksum "bun.lock" }}
                    - v1-mint-
            - run:
                command: bun turbo check
                environment:
                    TURBO_CONCURRENCY: "1"
                name: Check
            - save_cache:
                key: v1-mint-{{ checksum "bun.lock" }}
                paths:
                    - ~/.mintlify
    setup-mise:
        steps:
            - checkout
            - run:
                command: |
                    curl https://mise.run | sh
                    echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
                name: Install mise
            - run:
                command: mise install --yes
                name: Install tools
            - restore_cache:
                keys:
                    - v1-deps-{{ checksum "bun.lock" }}
                    - v1-deps-
            - run:
                command: bun install --frozen-lockfile
                name: Install dependencies
            - save_cache:
                key: v1-deps-{{ checksum "bun.lock" }}
                paths:
                    - node_modules
                    - ~/.bun/install/cache
jobs:
    check:
        docker:
            - image: cimg/base:current
        resource_class: medium
        steps:
            - setup-mise
            - run:
                command: cp packages/cli/turbo.ci.json packages/cli/turbo.json
                name: Disable CLI build cache
            - run:
                command: cp packages/adapters/opencode/turbo.ci.json packages/adapters/opencode/turbo.json
                name: Disable OpenCode adapter build cache
            - run:
                command: cp packages/adapters/claude-code/turbo.ci.json packages/adapters/claude-code/turbo.json
                name: Disable Claude Code adapter build cache
            - run:
                command: cp packages/adapters/codex/turbo.ci.json packages/adapters/codex/turbo.json
                name: Disable Codex adapter build cache
            - run-check
            - run:
                command: git checkout packages
                name: Restore Turbo configs
            - store_test_results:
                path: test-results
    main-pipeline:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
        resource_class: medium
        steps:
            - setup-mise
            - run-check
            - store_test_results:
                path: test-results
            - run:
                command: bun scripts/release/version.ts
                name: Version Changesets
            - run:
                command: bun scripts/release/tag.ts
                name: Tag Release
            - notify-failure
    openapi-freshness:
        docker:
            - image: cimg/base:current
        resource_class: small
        steps:
            - setup-mise
            - run:
                command: bun run --cwd packages/engine codegen:registry --check --strict
                name: OpenAPI snapshot freshness
    release:
        docker:
            - image: cimg/base:current
        environment:
            LEFTHOOK: "0"
            MISE_ENV: release
            TURBO_CONCURRENCY: "1"
        resource_class: medium
        steps:
            - setup-mise
            - run:
                command: bun scripts/release/publish.ts
                name: Publish
            - notify-failure
orbs:
    aws-cli: circleci/aws-cli@5.4.1
parameters:
    package:
        default: ""
        type: string
version: 2.1
workflows:
    ci:
        jobs:
            - check:
                context:
                    - turbo-cache
                    - github
                filters:
                    branches:
                        ignore:
                            - main
            - openapi-freshness:
                context:
                    - github
                filters:
                    branches:
                        ignore:
                            - main
            - main-pipeline:
                context:
                    - turbo-cache
                    - bot-context
                    - slack-secrets
                    - github
                filters:
                    branches:
                        only:
                            - main
                serial-group: << pipeline.project.slug >>/main-pipeline

