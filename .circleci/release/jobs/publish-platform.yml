parameters:
  target:
    type: string
docker:
  - image: cimg/base:current
resource_class: small
environment:
  LEFTHOOK: "0"
  MISE_ENV: release
steps:
  - setup-env
  - attach_workspace:
      at: .
  - run:
      name: Publish << parameters.target >>
      command: bun scripts/release-cli/publish-platform.ts << parameters.target >>
  - notify-failure
