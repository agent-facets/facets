  <script>

document.addEventListener('DOMContentLoaded', async () => {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', (e) => {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ` (${e.filename.slice(0, 60)}:${e.lineno})` : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus(`Unpacking ${uuids.length} assets...`);

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn(`DecompressionStream not available, asset ${uuid} may not render`);
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error(`Failed to decode asset ${uuid}:`, err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise((r) => { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus(`Error unpacking: ${err.message}`);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
   "<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Agent Facets — Design System<\u002Ftitle>\n<style>/**\n * Agent Facets — Colors & Type tokens\n *\n * Single source of truth for the brand. Mirrors @agent-facets/brand\n * (packages/brand/src/{colors,fonts,css}.ts) — see README.md \"Visual\n * Foundations\" for usage notes.\n *\n * Two themes, dark-first. The landing page (agentfacets.io) defaults\n * to dark; an `html[data-theme=\"light\"]` flip swaps the theme-dependent\n * surfaces. Font stacks don't differ between themes.\n *\n * The product is a CLI + companion web surfaces (landing, docs at\n * Mintlify, registry at facet.cafe). The \"ink/surface\" + \"accent\"\n * pairing is intentional: surfaces are quiet (near-black or warm bone),\n * accents are loud (violet/pink/sky/amber) and used as point lights —\n * borders, gradient text, swatches, badges — never as flooded\n * backgrounds.\n */\n\n/* ---------- Fonts ---------- *\n * Geist Variable          — sans, UI default\n * Geist Mono Variable     — mono, code + labels + small caps eyebrows\n * Instrument Serif italic — display-only, for the *italic accent word*\n *                           inside otherwise-sans headlines.\n *\n * The combo is the brand's signature: Geist (engineered, neutral) +\n * one italic serif word that adds warmth and craft to an otherwise\n * developer-tool voice.\n *\n * All three families are self-hosted via @fontsource woff2 files in\n * fonts/ — no CDN. See the @font-face set below.\n */\n/* ============================================================\n * Self-hosted fonts (woff2, variable where available).\n * Geist sans + Geist Mono ship as variable fonts (weight 100–900);\n * Instrument Serif is a single 400 weight. Subsets are scoped by\n * unicode-range exactly as @fontsource ships them, so the browser\n * only fetches the subsets a page actually renders. No CDN.\n * ============================================================ */\n\n/* ---- Geist Mono Variable (mono stack) ---- */\n@font-face {\n  font-family: \"Geist Mono Variable\";\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"9533cb7f-06db-4de3-a528-37baf60a6542\") format('woff2-variations');\n  unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;\n}\n@font-face {\n  font-family: \"Geist Mono Variable\";\n  font-style: italic;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"040b46bc-4bde-49fe-bef7-8766014ac2d2\") format('woff2-variations');\n  unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;\n}\n@font-face {\n  font-family: \"Geist Mono Variable\";\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"3cf10b9a-21db-4401-894f-6e0292cc84ac\") format('woff2-variations');\n  unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;\n}\n@font-face {\n  font-family: \"Geist Mono Variable\";\n  font-style: italic;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"23451c29-ea1b-477b-9106-5d425ccb3af4\") format('woff2-variations');\n  unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;\n}\n@font-face {\n  font-family: \"Geist Mono Variable\";\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"d82e0176-4411-4db9-9be1-1cd50a729c8d\") format('woff2-variations');\n  unicode-range: U+2000-2001,U+2004-2008,U+200A,U+23B8-23BD,U+2500-259F;\n}\n@font-face {\n  font-family: \"Geist Mono Variable\";\n  font-style: italic;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"05687ce3-4f85-4397-95eb-bc89e9abd983\") format('woff2-variations');\n  unicode-range: U+2000-2001,U+2004-2008,U+200A,U+23B8-23BD,U+2500-259F;\n}\n@font-face {\n  font-family: \"Geist Mono Variable\";\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"f814b969-7d25-46fd-aa02-4b7 U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;\n}\n@font-face {\n  font-family: \"Geist Variable\";\n  font-style: italic;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"f8e1f444-3bcb-45f1-a98c-10bd8535e765\") format('woff2-variations');\n  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;\n}\n\n/* coarse \"Geist\" alias — latin fallback */\n@font-face {\n  font-family: \"Geist\";\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"51e85d85-8566-44fe-842d-cb78a2daa903\") format('woff2-variations');\n  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;\n}\n@font-face {\n  font-family: \"Geist\";\n  font-style: italic;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"f8e1f444-3bcb-45f1-a98c-10bd8535e765\") format('woff2-variations');\n  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;\n}\n\n/* ---- Instrument Serif (display italic accent) ---- */\n@font-face {\n  font-family: \"Instrument Serif\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"57828cf5-2967-4da5-b1eb-4ba63de61fcb\") format('woff2');\n  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;\n}\n@font-face {\n  font-family: \"Instrument Serif\";\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b577dcdc-e9a5-4973-b447-7bbfd79dcc49\") format('woff2');\n  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;\n}\n@font-face {\n  font-family: \"Instrument Serif\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2f6292bc-e201-456b-b9a1-74a886e1cb9e\") format('woff2');\n  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;\n}\n@font-face {\n  font-family: \"Instrument Serif\";\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9a4610f3-42cd-4b75-bea2-0aa07f886add\") format('woff2');\n  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;\n}\n\n:root {\n  /* ===== Surface / ink scale (DARK — default) ===== */\n  --bg:        #0a0a12;        /* page background — near-black, slight cool tint */\n  --bg-elev:   #12121c;        /* elevated surfaces (cards, terminal, install pill) */\n  --ink:       #f5f4ff;        /* primary text — off-white with a violet whisper */\n  --ink-dim:   #a8a6c4;        /* secondary text, captions */\n  --ink-faint: #6a6890;        /* tertiary text, monospaced metadata */\n\n  /* ===== Line / divider ===== */\n  --line:        rgba(255, 255, 255, 0.08);\n  --line-strong: rgba(255, 255, 255, 0.16);\n\n  /* ===== Card surface (translucent, over --bg) ===== */\n  --card: rgba(255, 255, 255, 0.035);\n\n  /* ===== Accent palette =====\n   * Four-color set used as point lights. Each maps to one of the four\n   * facet primitives in product copy:\n   *   accent-a violet → skills/    (the \"knowledge\" facet)\n   *   accent-b pink   → agents/    (the \"specialist\" facet)\n   *   accent-c sky    → commands/  (the \"shortcut\" facet)\n   *   accent-d amber  → mcp/       (the \"tool\" facet)\n   * Order matters — don't reshuffle without updating the explainer.\n   */\n  --accent-a: #8b5cf6;  /* violet  — primary brand */\n  --accent-b: #ec4899;  /* pink    — secondary, used in \"Copy\" pill + gradient text */\n  --accent-c: #38bdf8;  /* sky     — success / prompt / eyebrow dot */\n  --accent-d: #fde047;  /* amber   — warning / flag / coral-ish on hover */\n\n  /* ===== Legacy brand triad (from facet.svg icon) =====\n   * The actual logo glyph uses purple #A78BFA, green #42CDAA, coral\n   * #FA8B8D on dark #1F1F28. Web surfaces use the brighter accent\n   * palette above; the triad lives on in the icon + animated gradients.\n   */\n  --brand-purple: #A78BFA;\n  --brand-green:  #42CDAA;\n  --brand-coral:  #FA8B8D;\n  --brand-dark:   #1F1F28;\n\n  /* ===== Type system ===== */\n  --sans:  \"Geist Variable\", \"Geist\", Inter, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;  /* @kind font */\n  --mono:  \"Geist Mono Variable\", \"Geist Mono\", ui-monospace, \"SF Mono\", Menlo, Monaco, Consolas, monospace;  /* @kind font */\n  --serif: \"Instrument Serif\", ui-serif, Georgia, \"Times New Roman\", serif;  /* @kind font */\n\n  /* Semantic type sizes (clamped to viewport).\n   * Use these for new compositions; existing CSS modules in the\n   * landing repo set sizes inline via clamp() per-component. */\n  --fs-display:  clamp(44px, 7vw,    96px);  /* @kind font */\n  --fs-h1:       clamp(36px, 5.5vw,  64px);  /* @kind font */\n  --fs-h2:       clamp(28px, 3.6vw,  44px);  /* @kind font */\n  --fs-h3:       22px;     /* @kind font */\n  --fs-lead:     19px;     /* @kind font */\n  --fs-body:     16px;     /* @kind font */\n  --fs-small:    14px;     /* @kind font */\n  --fs-caption:  12px;     /* @kind font */\n  --fs-micro:    10.5px;   /* @kind font */\n\n  --lh-tight:   0.95;   /* @kind font */\n  --lh-snug:    1.05;   /* @kind font */\n  --lh-normal:  1.5;    /* @kind font */\n  --lh-relaxed: 1.65;   /* @kind font */\n\n  --tracking-tight:   -0.04em;   /* @kind font */\n  --tracking-snug:    -0.025em;  /* @kind font */\n  --tracking-normal:   0em;      /* @kind font */\n  --tracking-mono:     0.01em;   /* @kind font */\n  --tracking-eyebrow:  0.2em;    /* @kind font */\n\n  /* ===== Spacing scale ===== */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 56px;\n  --space-14: 80px;\n  --space-16: 120px;\n\n  /* ===== Radii ===== */\n  --r-xs:   4px;     /* tab pills, monochrome badges */\n  --r-sm:   6px;     /* chips, dropdown items */\n  --r-md:   8px;     /* small icons, swatches */\n  --r-lg:   10px;    /* primitive boxes (260×80) */\n  --r-xl:   14px;    /* cards, terminal window, install pill */\n  --r-pill: 999px;   /* eyebrow, github btn, dashed CTA */\n\n  /* ===== Shadows =====\n   * Three flavors:\n   *  - Drop shadow (soft, neutral) — rarely used; surfaces prefer borders\n   *  - Accent glow (radial) — beneath hero CTAs, terminal window\n   *  - Inner highlight     — currently unused; reserved for buttons\n   */\n  --shadow-sm:    0 4px 12px -4px rgba(0, 0, 0, 0.4);\n  --shadow-md:    0 14px 40px -14px color-mix(in oklab, var(--accent-a) 55%, transparent);\n  --shadow-lg:    0 20px 60px -20px color-mix(in oklab, var(--accent-b) 50%, transparent);\n  --shadow-xl:    0 40px 100px -30px color-mix(in oklab, var(--accent-a) 40%, transparent);\n  --glow-violet:  0 0 80px color-mix(in oklab, var(--accent-a) 30%, transparent);\n\n  /* ===== Motion ===== */\n  --ease-out:    cubic-bezier(0.2, 0.9, 0.2, 1);   /* @kind other */\n  --ease-in-out: cubic-bezier(0.6, 0, 0.4, 1);     /* @kind other */\n  --dur-fast:    0.15s;   /* @kind other */\n  --dur-base:    0.22s;   /* @kind other */\n  --dur-slow:    0.5s;    /* @kind other */\n  --dur-stage:   0.9s;    /* @kind other */\n\n  /* ===== Layout ===== */\n  --nav-mobile-height: 55px;     /* @kind other */\n  --content-max:       1100px;   /* @kind other */\n  --bp-mobile:         1024px;   /* @kind other */\n}\n\n/* ---------- Light theme override ---------- *\n * Same accent semantics, slightly darker accent values so they hit\n * AA on a warm-bone background. The \"bg\" is intentionally NOT pure\n * white — #f6f4ef has a paper warmth that pairs with violet better\n * than #ffffff.\n */\nhtml[data-theme=\"light\"] {\n  --bg:        #f6f4ef;\n  --bg-elev:   #ffffff;\n  --ink:       #0e0e1a;\n  --ink-dim:   #4a4861;\n  --ink-faint: #8a8aa3;\n\n  --line:        rgba(10, 10, 30, 0.09);\n  --line-strong: rgba(10, 10, 30, 0.18);\n  --card:        rgba(10, 10, 30, 0.03);\n\n  --accent-a: #7c3aed;\n  --accent-b: #db2777;\n  --accent-c: #0284c7;\n  --accent-d: #ca8a04;\n}\n\n/* ---------- Semantic element styles ----------\n * Drop-in defaults so a fresh HTML doc inherits the brand without\n * each consumer rebuilding the type ramp. Override per-component.\n */\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--sans);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; }\n::selection { background: var(--accent-b); color: white; }\n:focus-visible { outline: 2px solid var(--accent-c); outline-offset: 2px; border-radius: 4px; }\n\nh1, .h1 {\n  font-family: var(--sans);\n  font-weight: 700;\n  font-size: var(--fs-h1);\n  letter-spacing: var(--tracking-tight);\n  line-height: var(--lh-snug);\n  margin: 0 0 var(--space-6);\n}\n\nh2, .h2 {\n  font-family: var(--sans);\n  font-weight: 700;\n  font-size: var(--fs-h2);\n  letter-spacing: var(--tracking-snug);\n  line-height: var(--lh-snug);\n  margin: 0 0 var(--space-5);\n}\n\nh3, .h3 {\n  font-family: var(--sans);\n  font-weight: 600;\n  font-size: var(--fs-h3);\n  letter-spacing: var(--tracking-snug);\n  line-height: 1.1;\n  margin: 0 0 var(--space-3);\n}\n\np, .body {\n  font-family: var(--sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--ink-dim);\n  margin: 0 0 var(--space-4);\n}\n\n.lead {\n  font-size: var(--fs-lead);\n  line-height: 1.55;\n  color: var(--ink-dim);\n}\n\n/* The signature italic-serif accent inside any sans headline.\n * Used as: <h1>So what's a <em>facet<\u002Fem>?<\u002Fh1> */\nh1 em, h2 em, h3 em, .display em {\n  font-family: var(--serif);\n  font-style: italic;\n  font-weight: 400;\n  color: var(--accent-a);\n}\n\n/* Mono treatments */\ncode, kbd, samp, .mono {\n  font-family: var(--mono);\n  font-size: 0.92em;\n}\n\n/* Eyebrow — small uppercase mono label that precedes a section title.\n * Always preceded by a ◆ in accent-b. */\n.eyebrow-label {\n  font-family: var(--mono);\n  font-size: var(--fs-caption);\n  color: var(--ink-faint);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n}\n.eyebrow-label::before {\n  content: \"◆ \";\n  color: var(--accent-b);\n}\n\n/* The animated \"gradient italic\" — used on the closing CTA word\n * (\"install\", \"manage\") and on the verb-rotor in the hero. */\n.gradient-text {\n  background: linear-gradient(100deg, var(--accent-a), var(--accent-b), var(--accent-d));\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n  color: transparent;\n  display: inline-block;\n  padding: 0.05em 0.1em;\n  margin: -0.05em -0.1em;\n}\n<\u002Fstyle>\n\n<style>\n  :root { --maxw: 1080px; --gutter: 40px; }\n  body { background: var(--bg); color: var(--ink); }\n  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }\n\n  /* ---------- masthead ---------- */\n  .masthead { padding: 96px 0 64px; border-bottom: 1px solid var(--line); }\n  .mark { display: flex; flex-direction: column; gap: 4px; width: 52px; margin-bottom: 28px; }\n  .mark span { height: 9px; border-radius: 3px; }\n  .mark span:nth-child(1) { background: var(--accent-c); }\n  .mark span:nth-child(2) { background: var(--accent-a); }\n  .mark span:nth-child(3) { background: var(--accent-b); }\n  .mark span:nth-child(4) { background: var(--accent-d); }\n  .masthead h1 { font-size: clamp(40px, 7vw, 76px); line-height: 1.0; letter-spacing: -0.04em; margin: 0 0 20px; }\n  .masthead .lead { font-size: 20px; max-width: 60ch; margin: 0 0 28px; }\n  .metaRow { display: flex; flex-wrap: wrap; gap: 10px; }\n  .metaTag { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 6px 13px; }\n\n  /* ---------- section scaffolding ---------- */\n  section.block { padding: 64px 0; border-bottom: 1px solid var(--line); }\n  .sectionLabel { font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px; }\n  .sectionLabel::before { content: \"◆ \"; color: var(--accent-b); }\n  .block > h2 { font-size: 30px; letter-spacing: -0.025em; margin: 0 0 8px; }\n  .block > .blurb { font-size: 15px; color: var(--ink-dim); max-width: 70ch; margin: 0 0 32px; }\n  .subhead { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); margin: 32px 0 16px; }\n  .grid { display: grid; gap: 16px; }\n\n  /* ---------- swatches ---------- */\n  .swatchRow { display: flex; flex-wrap: wrap; gap: 14px; }\n  .swatch { width: 150px; height: 110px; border-radius: var(--r-xl); border: 1px solid var(--line-strong); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; }\n  .swatch .nm { font-family: var(--mono); font-size: 12px; color: #fff; }\n  .swatch .hx { font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }\n  .swatch.onlight .nm { color: #0e0e1a; }\n  .swatch.onlight .hx { color: rgba(14,14,26,0.6); }\n\n  /* ---------- type specimens ---------- */\n  .specimen { display: flex; flex-direction: column; gap: 6px; }\n  .specimen .lbl { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }\n  .display-line { font-size: clamp(32px, 5vw, 56px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; }\n  .display-line em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent-a); }\n  .wt { display: flex; align-items: baseline; gap: 16px; }\n  .wt b { width: 44px; font-family: var(--mono); font-size: 13px; color: var(--ink-faint); font-weight: 400; }\n  .scaleList { display: flex; flex-direction: column; gap: 10px; }\n  .scaleList > div { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }\n  .scaleList .tok { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); width: 130px; flex: 0 0 auto; }\n\n  /* ---------- spacing / radii / shadows ---------- */\n  .spaceRow { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }\n  .spaceCell { display: flex; flex-direction: column; align-items: center; gap: 8px; }\n  .spaceCell .bar { background: color-mix(in oklab, var(--accent-a) 60%, var(--bg-elev)); border-radius: 3px; width: 26px; }\n  .spaceCell .tok { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }\n  .radiiRow, .shadowRow { display: flex; flex-wrap: wrap; gap: 18px; }\n  .radiiCell { display: flex; flex-direction: column; align-items: center; gap: 8px; }\n  .radiiCell .box { width: 84px; height: 84px; background: var(--bg-elev); border: 1px solid var(--line-strong); }\n  .radiiCell .tok, .shadowCell .tok { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }\n  .shadowCell { display: flex; flex-direction: column; align-items: center; gap: 12px; }\n  .shadowCell .box { width: 130px; height: 84px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--r-xl); }\n\n  /* ---------- components ---------- */\n  .compRow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }\n  .eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 7px 15px; border: 1px solid var(--line-strong); border-radius: var(--r-pill); background: var(--card); font-family: var(--mono); font-size: 12px; color: var(--ink-dim); letter-spacing: 0.04em; }\n  .eyebrowDot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-c); }\n  .primaryBtn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-a); color: #fff; border: 0; font-family: var(--sans); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: var(--r-md); cursor: pointer; }\n  .ghostBtn { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line-strong); color: var(--ink); font-family: var(--sans); font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: var(--r-md); cursor: pointer; }\n  .dangerBtn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; font-size: 14px; font-weight: 600; color: var(--accent-d); background: transparent; border: 1px solid var(--accent-d); border-radius: var(--r-md); cursor: pointer; font-family: var(--sans); }\n  .successBtn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; font-size: 14px; font-weight: 600; color: var(--accent-c); background: transparent; border: 1px solid var(--accent-c); border-radius: var(--r-md); cursor: pointer; font-family: var(--sans); }\n  .copyBtn { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--line-strong); color: var(--ink-dim); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: var(--r-md); cursor: pointer; }\n  .badge { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: var(--r-md); letter-spacing: 0.02em; }\n  .badgeGhost { color: var(--ink-faint); background: var(--card); border: 1px solid var(--line); }\n  .badgeSuccess { color: var(--accent-c); background: color-mix(in srgb, var(--accent-c) 12%, transparent); }\n  .badgeError { color: var(--accent-d); background: color-mix(in srgb, var(--accent-d) 12%, transparent); }\n  .badgeWarn { color: var(--accent-b); background: color-mix(in srgb, var(--accent-b) 12%, transparent); }\n  .badgeInfo { color: var(--accent-a); background: color-mix(in srgb, var(--accent-a) 12%, transparent); }\n\n  /* chips */\n  .chipRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--c) 14%, transparent); border: 1px solid color-mix(in oklab, var(--c) 36%, transparent); color: color-mix(in oklab, var(--c) 80%, var(--ink)); white-space: nowrap; }\n  .chipDot { width: 6px; height: 6px; border-radius: 2px; background: var(--c); flex: 0 0 auto; }\n\n  /* install pill */\n  .installPill { max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: var(--r-xl); padding: 14px 14px 14px 20px; }\n  .installCmd { font-family: var(--mono); font-size: 15px; color: var(--ink); }\n  .ip-prompt { color: var(--accent-c); margin-right: 6px; }\n  .ip-verb { color: var(--accent-b); }\n\n  /* registry cards */\n  .cardGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }\n  .facetCard { display: flex; flex-direction: column; gap: 8px; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: var(--r-xl); padding: 20px; }\n  .fcTop { display: flex; align-items: baseline; gap: 10px; }\n  .fcName { font-family: var(--mono); font-weight: 600; font-size: 16px; color: var(--ink); letter-spacing: -0.01em; white-space: nowrap; }\n  .verified { display: inline-flex; color: var(--accent-c); vertical-align: -2px; }\n  .fcVer { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; }\n  .fcBy { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }\n  .fcDesc { font-size: 14px; line-height: 1.5; color: var(--ink-dim); margin: 4px 0 0; }\n  .fcFoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }\n  .fcInstalls { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }\n\n  .facetRow { display: flex; align-items: center; gap: 20px; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: var(--r-xl); padding: 16px 20px; }\n  .frMain { flex: 1; min-width: 0; }\n  .frHead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }\n  .frName { font-family: var(--mono); font-weight: 600; font-size: 16px; color: var(--ink); white-space: nowrap; }\n  .frVer { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }\n  .frBy { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }\n  .frDesc { font-size: 14px; line-height: 1.5; color: var(--ink-dim); margin: 5px 0 10px; max-width: 70ch; }\n  .frSide { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: 0 0 auto; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }\n\n  /* hero search */\n  .heroSearch { max-width: 580px; display: flex; align-items: center; gap: 10px; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: var(--r-xl); padding: 8px 8px 8px 18px; box-shadow: 0 24px 70px -28px color-mix(in oklab, var(--accent-a) 55%, transparent); }\n  .heroSearch .ph { flex: 1; min-width: 0; color: var(--ink-faint); font-family: var(--sans); font-size: 16px; }\n  .heroSearchBtn { flex: 0 0 auto; background: var(--accent-a); color: #fff; border: 0; font-family: var(--sans); font-weight: 600; font-size: 14px; padding: 11px 22px; border-radius: 10px; }\n  .catRow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }\n  .catChip { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid color-mix(in oklab, var(--c) 30%, var(--line-strong)); border-radius: var(--r-pill); padding: 7px 15px; }\n  .catDot { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }\n  .catDir { font-family: var(--mono); font-size: 13px; color: var(--ink); }\n\n  /* light scope — replicates html[data-theme=light] tokens on a subtree */\n  .light-scope {\n    --bg: #f6f4ef; --bg-elev: #ffffff; --ink: #0e0e1a; --ink-dim: #4a4861; --ink-faint: #8a8aa3;\n    --line: rgba(10,10,30,0.09); --line-strong: rgba(10,10,30,0.18); --card: rgba(10,10,30,0.03);\n    --accent-a: #7c3aed; --accent-b: #db2777; --accent-c: #0284c7; --accent-d: #ca8a04;\n    background: var(--bg); color: var(--ink); border-radius: var(--r-xl); border: 1px solid var(--line-strong); padding: 32px;\n  }\n  .light-scope .panelLabel { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 20px; }\n\n  footer { padding: 48px 0 80px; }\n  footer .foot { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); display: flex; gap: 18px; flex-wrap: wrap; }\n  svg.ico { display: inline-flex; flex: 0 0 auto; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"masthead\">\n  <div class=\"wrap\">\n    <div class=\"mark\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <h1>Agent Facets<br><em style=\"font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent-a);\">Design System<\u002Fem><\u002Fh1>\n    <p class=\"lead\">The visual + content language for a capability package manager for AI coding assistants — landing, docs, registry, and CLI. Quiet surfaces, loud accents used as point lights.<\u002Fp>\n    <div class=\"metaRow\">\n      <span class=\"metaTag\">Geist · sans<\u002Fspan>\n      <span class=\"metaTag\">Geist Mono · mono<\u002Fspan>\n      <span class=\"metaTag\">Instrument Serif · display italic<\u002Fspan>\n      <span class=\"metaTag\">self-hosted · no CDN<\u002Fspan>\n      <span class=\"metaTag\">dark-first · light parity<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- COLORS -->\n<section class=\"block\"><div class=\"wrap\">\n  <p class=\"sectionLabel\">Colors<\u002Fp>\n  <h2>Accent palette<\u002Fh2>\n  <p class=\"blurb\">Four point-light accents, each mapped to one facet primitive: violet → skills, pink → agents, sky → commands, amber → mcp. Order is semantic — never reshuffle.<\u002Fp>\n  <div class=\"swatchRow\">\n    <div class=\"swatch\" style=\"background:#8b5cf6;\"><div class=\"nm\">accent-a<\u002Fdiv><div class=\"hx\">#8b5cf6 · violet<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#ec4899;\"><div class=\"nm\">accent-b<\u002Fdiv><div class=\"hx\">#ec4899 · pink<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#38bdf8;\"><div class=\"nm\">accent-c<\u002Fdiv><div class=\"hx\">#38bdf8 · sky<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#fde047;\"><div class=\"nm onlight\">accent-d<\u002Fdiv><div class=\"hx onlight\">#fde047 · amber<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"subhead\">Accents · light theme (one stop darker for AA on bone)<\u002Fp>\n  <div class=\"swatchRow\">\n    <div class=\"swatch\" style=\"background:#7c3aed;\"><div class=\"nm\">accent-a<\u002Fdiv><div class=\"hx\">#7c3aed<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#db2777;\"><div class=\"nm\">accent-b<\u002Fdiv><div class=\"hx\">#db2777<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#0284c7;\"><div class=\"nm\">accent-c<\u002Fdiv><div class=\"hx\">#0284c7<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#ca8a04;\"><div class=\"nm\">accent-d<\u002Fdiv><div class=\"hx\">#ca8a04<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"subhead\">Ink + surface · dark<\u002Fp>\n  <div class=\"swatchRow\">\n    <div class=\"swatch\" style=\"background:#0a0a12;\"><div class=\"nm\">bg<\u002Fdiv><div class=\"hx\">#0a0a12<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#12121c;\"><div class=\"nm\">bg-elev<\u002Fdiv><div class=\"hx\">#12121c<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#f5f4ff;\"><div class=\"nm onlight\">ink<\u002Fdiv><div class=\"hx onlight\">#f5f4ff<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#a8a6c4;\"><div class=\"nm onlight\">ink-dim<\u002Fdiv><div class=\"hx onlight\">#a8a6c4<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#6a6890;\"><div class=\"nm\">ink-faint<\u002Fdiv><div class=\"hx\">#6a6890<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"subhead\">Legacy brand triad (icon palette)<\u002Fp>\n  <div class=\"swatchRow\">\n    <div class=\"swatch\" style=\"background:#A78BFA;\"><div class=\"nm\">brand-purple<\u002Fdiv><div class=\"hx\">#A78BFA<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#42CDAA;\"><div class=\"nm\">brand-green<\u002Fdiv><div class=\"hx\">#42CDAA<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#FA8B8D;\"><div class=\"nm\">brand-coral<\u002Fdiv><div class=\"hx\">#FA8B8D<\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\" style=\"background:#1F1F28;\"><div class=\"nm\">brand-dark<\u002Fdiv><div class=\"hx\">#1F1F28<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- TYPE -->\n<section class=\"block\"><div class=\"wrap\">\n  <p class=\"sectionLabel\">Type<\u002Fp>\n  <h2>Typography<\u002Fh2>\n  <p class=\"blurb\">Geist (engineered, neutral) carries the UI; one italic Instrument Serif word adds warmth inside an otherwise developer-tool voice. Geist Mono handles code, labels, and eyebrows.<\u002Fp>\n  <div class=\"specimen\">\n    <span class=\"lbl\">display · sans + italic-serif accent<\u002Fspan>\n    <div class=\"display-line\">Everything your agent can <em>do<\u002Fem>.<\u002Fdiv>\n    <div class=\"display-line\">Install a facet in <em>six seconds<\u002Fem>.<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"subhead\">Geist weights<\u002Fp>\n  <div class=\"grid\" style=\"gap:10px;\">\n    <div class=\"wt\"><b>700<\u002Fb><span style=\"font-weight:700;font-size:24px;\">Headline weight<\u002Fspan><\u002Fdiv>\n    <div class=\"wt\"><b>600<\u002Fb><span style=\"font-weight:600;font-size:20px;\">Buttons + labels<\u002Fspan><\u002Fdiv>\n    <div class=\"wt\"><b>500<\u002Fb><span style=\"font-weight:500;font-size:18px;\">Preamble copy<\u002Fspan><\u002Fdiv>\n    <div class=\"wt\"><b>400<\u002Fb><span style=\"font-weight:400;font-size:16px;color:var(--ink-dim);\">Body. The simple, safe way to manage capabilities for any AI agent.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"subhead\">Geist Mono<\u002Fp>\n  <div class=\"mono\" style=\"font-size:15px;color:var(--ink-dim);\">facet add viper-plans &nbsp; <span style=\"color:var(--accent-c);\">$<\u002Fspan> &nbsp; SKILLS/AGENTS/COMMANDS/MCP &nbsp; 0.0.1<\u002Fdiv>\n  <p class=\"subhead\">Type scale<\u002Fp>\n  <div class=\"scaleList\">\n    <div><span class=\"tok\">--fs-display<\u002Fspan><span style=\"font-size:34px;font-weight:700;letter-spacing:-0.03em;\">Display<\u002Fspan><\u002Fdiv>\n    <div><span class=\"tok\">--fs-h1<\u002Fspan><span style=\"font-size:28px;font-weight:700;letter-spacing:-0.02em;\">Heading 1<\u002Fspan><\u002Fdiv>\n    <div><span class=\"tok\">--fs-h2<\u002Fspan><span style=\"font-size:24px;font-weight:700;\">Heading 2<\u002Fspan><\u002Fdiv>\n    <div><span class=\"tok\">--fs-h3<\u002Fspan><span style=\"font-size:22px;font-weight:600;\">Heading 3<\u002Fspan><\u002Fdiv>\n    <div><span class=\"tok\">--fs-lead<\u002Fspan><span style=\"font-size:19px;color:var(--ink-dim);\">Lead paragraph<\u002Fspan><\u002Fdiv>\n    <div><span class=\"tok\">--fs-body<\u002Fspan><span style=\"font-size:16px;color:var(--ink-dim);\">Body text<\u002Fspan><\u002Fdiv>\n    <div><span class=\"tok\">--fs-caption<\u002Fspan><span style=\"font-size:12px;font-family:var(--mono);color:var(--ink-faint);\">MONO CAPTION<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- SPACING / RADII / SHADOWS -->\n<section class=\"block\"><div class=\"wrap\">\n  <p class=\"sectionLabel\">Spacing<\u002Fp>\n  <h2>Spacing, radii &amp; shadows<\u002Fh2>\n  <p class=\"blurb\">A 4px-based spacing scale, six radii from chip to pill, and accent-tinted glows reserved for hero CTAs — surfaces otherwise prefer borders to drop shadows.<\u002Fp>\n  <p class=\"subhead\">Spacing scale<\u002Fp>\n  <div class=\"spaceRow\">\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:4px;\"><\u002Fdiv><div class=\"tok\">1·4<\u002Fdiv><\u002Fdiv>\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:8px;\"><\u002Fdiv><div class=\"tok\">2·8<\u002Fdiv><\u002Fdiv>\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:12px;\"><\u002Fdiv><div class=\"tok\">3·12<\u002Fdiv><\u002Fdiv>\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:16px;\"><\u002Fdiv><div class=\"tok\">4·16<\u002Fdiv><\u002Fdiv>\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:24px;\"><\u002Fdiv><div class=\"tok\">6·24<\u002Fdiv><\u002Fdiv>\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:32px;\"><\u002Fdiv><div class=\"tok\">8·32<\u002Fdiv><\u002Fdiv>\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:56px;\"><\u002Fdiv><div class=\"tok\">12·56<\u002Fdiv><\u002Fdiv>\n    <div class=\"spaceCell\"><div class=\"bar\" style=\"height:80px;\"><\u002Fdiv><div class=\"tok\">14·80<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"subhead\">Radii<\u002Fp>\n  <div class=\"radiiRow\">\n    <div class=\"radiiCell\"><div class=\"box\" style=\"border-radius:4px;\"><\u002Fdiv><div class=\"tok\">xs · 4<\u002Fdiv><\u002Fdiv>\n    <div class=\"radiiCell\"><div class=\"box\" style=\"border-radius:6px;\"><\u002Fdiv><div class=\"tok\">sm · 6<\u002Fdiv><\u002Fdiv>\n    <div class=\"radiiCell\"><div class=\"box\" style=\"border-radius:8px;\"><\u002Fdiv><div class=\"tok\">md · 8<\u002Fdiv><\u002Fdiv>\n    <div class=\"radiiCell\"><div class=\"box\" style=\"border-radius:10px;\"><\u002Fdiv><div class=\"tok\">lg · 10<\u002Fdiv><\u002Fdiv>\n    <div class=\"radiiCell\"><div class=\"box\" style=\"border-radius:14px;\"><\u002Fdiv><div class=\"tok\">xl · 14<\u002Fdiv><\u002Fdiv>\n    <div class=\"radiiCell\"><div class=\"box\" style=\"border-radius:999px;\"><\u002Fdiv><div class=\"tok\">pill<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"subhead\">Shadows + glow<\u002Fp>\n  <div class=\"shadowRow\">\n    <div class=\"shadowCell\"><div class=\"box\" style=\"box-shadow:var(--shadow-sm);\"><\u002Fdiv><div class=\"tok\">shadow-sm<\u002Fdiv><\u002Fdiv>\n    <div class=\"shadowCell\"><div class=\"box\" style=\"box-shadow:var(--shadow-md);\"><\u002Fdiv><div class=\"tok\">shadow-md<\u002Fdiv><\u002Fdiv>\n    <div class=\"shadowCell\"><div class=\"box\" style=\"box-shadow:var(--shadow-lg);\"><\u002Fdiv><div class=\"tok\">shadow-lg<\u002Fdiv><\u002Fdiv>\n    <div class=\"shadowCell\"><div class=\"box\" style=\"box-shadow:var(--glow-violet);\"><\u002Fdiv><div class=\"tok\">glow-violet<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- COMPONENTS -->\n<section class=\"block\"><div class=\"wrap\">\n  <p class=\"sectionLabel\">Components<\u002Fp>\n  <h2>Core components<\u002Fh2>\n  <p class=\"blurb\">Buttons, chips, badges, eyebrow labels, and the click-to-copy install pill — the shared vocabulary across every surface.<\u002Fp>\n  <p class=\"subhead\">Eyebrow<\u002Fp>\n  <span class=\"eyebrow\"><span class=\"eyebrowDot\"><\u002Fspan>the registry for agent capabilities<\u002Fspan>\n  <p class=\"subhead\">Buttons<\u002Fp>\n  <div class=\"compRow\">\n    <button type=\"button\" class=\"primaryBtn\">Install facet<\u002Fbutton>\n    <button type=\"button\" class=\"ghostBtn\">View source<\u002Fbutton>\n    <button type=\"button\" class=\"successBtn\">Approve<\u002Fbutton>\n    <button type=\"button\" class=\"dangerBtn\">Reject<\u002Fbutton>\n    <button type=\"button\" class=\"copyBtn\"><svg class=\"ico\" width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"4\" y=\"4\" width=\"9\" height=\"10\" rx=\"1\"><\u002Frect><path d=\"M3 11V3a1 1 0 011-1h8\"><\u002Fpath><\u002Fsvg>Copy<\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"subhead\">Status badges<\u002Fp>\n  <div class=\"compRow\">\n    <span class=\"badge badgeSuccess\">SUCCEEDED<\u002Fspan>\n    <span class=\"badge badgeInfo\">APPROVED<\u002Fspan>\n    <span class=\"badge badgeWarn\">PENDING<\u002Fspan>\n    <span class=\"badge badgeError\">REJECTED<\u002Fspan>\n    <span class=\"badge badgeGhost\">CANCELLED<\u002Fspan>\n  <\u002Fdiv>\n  <p class=\"subhead\">Install pill<\u002Fp>\n  <div class=\"installPill\">\n    <span class=\"installCmd\"><span class=\"ip-prompt\">$<\u002Fspan>facet <span class=\"ip-verb\">add<\u002Fspan> viper-plans<\u002Fspan>\n    <button type=\"button\" class=\"copyBtn\"><svg class=\"ico\" width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"4\" y=\"4\" width=\"9\" height=\"10\" rx=\"1\"><\u002Frect><path d=\"M3 11V3a1 1 0 011-1h8\"><\u002Fpath><\u002Fsvg>Copy<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- REGISTRY UI KIT -->\n<section class=\"block\"><div class=\"wrap\">\n  <p class=\"sectionLabel\">UI Kit — Registry<\u002Fp>\n  <h2>Registry surface<\u002Fh2>\n  <p class=\"blurb\">facet.cafe patterns — facet cards, list rows, accent-mapped count chips, the detail masthead, and the home search — all built on the same tokens.<\u002Fp>\n  <p class=\"subhead\">Facet cards<\u002Fp>\n  <div class=\"cardGrid\">\n    <div class=\"facetCard\">\n      <div class=\"fcTop\"><span clas
