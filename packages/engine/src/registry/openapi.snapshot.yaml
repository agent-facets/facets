                  - github_copilot
                  - opencode
                  - other
                  - windsurf
            q04:
              enum:
                - claude_code
                - codex
                - cursor
                - gemini_cli
                - github_copilot
                - opencode
                - other
                - windsurf
            q05:
              type: array
              minItems: 1
              items:
                enum:
                  - checked_into_repos
                  - distributed_ci
                  - dotfiles_symlinks
                  - individual
                  - no_custom_config
                  - shared_informally
            q06:
              type: array
              minItems: 1
              items:
                enum:
                  - custom_agents
                  - custom_commands
                  - custom_skills
                  - internal_mcp_servers
                  - mcp_configs
                  - none_builtins
            q07:
              type: array
              minItems: 1
              items:
                enum:
                  - breaking_update
                  - held_off_install
                  - manual_porting
                  - none
                  - rewrote_skill
                  - security_asked
                  - version_mismatch
            q10:
              enum:
                - me
                - named_owner
                - nobody_yet
                - shared_no_owner
            q11:
              enum:
                - no
                - sandbox_only
                - yes
                - yes_after_approval
            q12:
              enum:
                - cannot_commit
                - daily_plus_checkins
                - plus_rollout
                - plus_weekly_feedback
            q13:
              anyOf:
                - type: array
                  maxItems: 3
                  minItems: 1
                  items:
                    enum:
                      - adoption_help
                      - consistent_installs
                      - control_agents
                      - evaluate_governance
                      - replace_glue
                      - standardize_team
                - enum:
                    - adoption_help
                    - consistent_installs
                    - control_agents
                    - evaluate_governance
                    - replace_glue
                    - standardize_team
            q14:
              enum:
                - founder_network
                - github
                - other
                - referral
            q08:
              type: string
            q09:
              type: string
            q14_other:
              type: string
            q15:
              type: string
            q16:
              type: string
          required:
            - q01
            - q02
            - q03
            - q04
            - q05
            - q06
            - q07
            - q10
            - q11
            - q12
            - q13
            - q14
        consent:
          const: true
        contact:
          type: object
          properties:
            email:
              type: string
            name:
              type: string
          required:
            - email
      required:
        - answers
        - consent
        - contact
paths:
  /v0/health:
    get:
      operationId: getV0Health
      summary: Liveness probe
      tags:
        - health
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v0/facets:
    get:
      operationId: getV0Facets
      parameters:
        - in: query
          name: sort
          schema:
            enum:
              - name
              - recent
              - relevance
            default: relevance
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: type
          schema:
            enum:
              - agents
              - commands
              - servers
              - skills
      summary: List or search facets
      description: Searches published facets via the supported search path. Supports
        `?q=` substring matching, `?sort=` (relevance|recent|name) with
        deterministic ordering, `?type=` (skills|commands|agents|servers) to
        narrow to facets shipping one primitive, and opaque `?cursor=`
        pagination. Anonymous callers see only public facets; authenticated
        callers also see private facets they are entitled to. The response is
        `no-store` and never reveals how many facets were hidden.
      tags:
        - facets
      responses:
        "200":
          description: A page of facet summaries with an optional continuation cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Invalid query parameters, or a cursor invalid for this search
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorBody"
                  - $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/metadata/batch:
    post:
      operationId: postV0FacetsMetadataBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMetadataRequest"
      summary: Resolve metadata for many facet versions
      description: >-
        Resolves an ordered list of up to 100 `{ name, version }` items in one
        request.

        Each `version` may be `latest`, an exact version, or a semver range.


        Every input position gets exactly one result, in order, and duplicate
        items stay duplicated.

        A result carries one outcome: `resolved`, `invalid_name`,
        `invalid_version_spec`, or `unresolved`.

        An item that fails does not prevent the others from resolving, so a 200
        does NOT mean every item resolved —

        read each outcome. `unresolved` is caller-relative: it means nothing YOU
        may read matches, and a facet you are

        not authorized to see is deliberately indistinguishable from one that
        does not exist.


        Send the body as `application/json` or any media type with a `+json`
        structured suffix; a body under any

        other media type is rejected with 415.

        Names are taken literally and are never URL-decoded: send `@scope/name`,
        not `%40scope/name`.

        Authentication is optional — an absent credential reads anonymously,
        while a presented credential that is

        invalid is rejected rather than downgraded. Responses are always
        `Cache-Control: no-store`, because

        visibility is caller-relative and `latest`/range resolution changes as
        versions publish.
      tags:
        - facets
      responses:
        "200":
          description: One ordered outcome per requested item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchMetadataResponse"
        "400":
          description: Malformed JSON, or a request body that is not a valid batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: A credential was presented and is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: The presented credential may not read the registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "413":
          description: More than 100 items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "415":
          description: The request body was not sent as JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: Unexpected registry failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: A registry dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/count:
    get:
      operationId: getV0FacetsCount
      summary: Public facet count
      description: Returns the projected count of live public facets. The count is
        event-backed and eventually consistent; it is never derived from facet
        search and never reveals private facet counts.
      tags:
        - facets
      responses:
        "200":
          description: Aggregate public facet count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFacetCountResponse"
  /v0/facets/popular:
    get:
      operationId: getV0FacetsPopular
      summary: Popular facets
      description: Returns up to four public facets ranked by distinct public archive
        requests over a rolling 90-day window. Facet metadata is read live from
        authoritative registry state, so entries always reflect current public
        facets. Request counts and the ranking window are not exposed. A ranking
        that is missing or too old to present returns an empty list rather than
        an unranked fallback.
      tags:
        - facets
      responses:
        "200":
          description: Popular public facets, most popular first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularFacetsResponse"
  /v0/facets/{scope}/{name}/latest-version:
    get:
      operationId: getV0FacetsByScopeByNameLatestVersion
      summary: Get the latest version pointer for a scoped facet
      description: Returns the current latest version string for a scoped facet.
        Short-cached.
      tags:
        - facets
      parameters:
        - &a1
          name: scope
          in: path
          required: true
          description: Scope name with the leading `@` (e.g. `@julian`).
          schema:
            type: string
            pattern: ^@[a-z][a-z0-9-]*[a-z0-9]$
        - &a2
          name: name
          in: path
          required: true
          description: Facet name within the scope (e.g. `cowsay`).
          schema:
            type: string
            pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
      responses:
        "200":
          description: Latest version pointer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestVersionResponse"
        "404":
          description: Facet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/versions/{version}:
    get:
      operationId: getV0FacetsByScopeByNameVersionsByVersion
      summary: Get the full version list for a scoped facet
      description: Returns the complete sorted version list for a scoped facet.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
        - &a3
          name: version
          in: path
          required: true
          description: "Semver version (e.g., `1.2.3`), `latest`, or a wildcard: `M.*`
            (highest in major), `M.N.*` (highest patch), or `*` (latest).
            Wildcards exclude pre-release versions."
          schema:
            type: string
      responses:
        "200":
          description: Full version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionListResponse"
        "404":
          description: Facet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/{version}:
    get:
      operationId: getV0FacetsByScopeByNameByVersion
      summary: Get metadata for a specific version of a scoped facet
      description: Returns the version metadata for a scoped facet. The version may be
        `latest`.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
        - *a3
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionMetadata"
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/{version}/archive:
    get:
      operationId: getV0FacetsByScopeByNameByVersionArchive
      summary: Download a scoped facet version's tarball
      description: 302 redirects to a 5-minute presigned S3 URL.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
        - *a3
      responses:
        "302":
          description: Redirect to a 5-minute presigned S3 URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/{version}/contents:
    get:
      operationId: getV0FacetsByScopeByNameByVersionContents
      summary: Get the verified files of a scoped facet version
      description: Returns every verified file in the scoped facet version except the
        manifest, as a path-sorted list of text content and binary metadata.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
        - *a3
      responses:
        "200":
          description: Verified files (text content and binary metadata)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentsResponse"
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}:
    get:
      operationId: getV0FacetsByScope
      summary: Get scope-root detail
      description: Returns a live scope by its @-prefixed name, including the
        structured owner identity and summaries of the facets published under
        that scope. Missing scopes return 404; pending organization claims are
        never exposed as live scopes.
      tags:
        - facets
      parameters:
        - *a1
      responses:
        "200":
          description: Scope-root detail with facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeRootResponse"
        "404":
          description: Scope not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "422":
          description: Invalid scope name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{name}/latest-version:
    get:
      operationId: getV0FacetsByNameLatestVersion
      summary: Get the latest version pointer for a facet
      description: Returns the caller-relative latest version string for a facet — the
        highest version the caller is authorized to read. Downstream reads key
        off the concrete version it returns.
      tags:
        - facets
      parameters:
        - &a4
          name: name
          in: path
          required: true
          description: Canonical facet name. For scoped facets use the literal-slash path
            (`/@scope/name/...`) instead of encoding the slash.
          schema:
            type: string
            pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
      responses:
        "200":
          description: Latest version pointer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestVersionResponse"
        "404":
          description: Facet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{name}/versions/{version}:
    get:
      operationId: getV0FacetsByNameVersionsByVersion
      summary: Get the full version list for a facet
      description: "Returns the sorted list of versions the caller is authorized to
        see. Responses are `no-store`: the visible set is caller-relative, so a
        list cached for one caller must not be served to another."
      tags:
        - facets
      parameters:
        - *a4
        - *a3
      responses:
        "200":
          description: Full version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionListResponse"
        "404":
          description: Facet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{name}/{version}:
    get:
      operationId: getV0FacetsByNameByVersion
      summary: Get metadata for a specific version
      description: Returns the version row's metadata including the verbatim
        manifestJson string and the verified publisher username. `version` may
        be `latest`, which resolves to the highest version the caller is
        authorized to read. A concrete public version is immutable and identical
        for every caller, so it is long-cacheable; a private version is
        `no-store` because each read is authorized at request time, as is a
        `latest` resolution.
      tags:
        - facets
      parameters:
        - *a4
        - *a3
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionMetadata"
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{name}/{version}/archive:
    get:
      operationId: getV0FacetsByNameByVersionArchive
      summary: Download the version's tarball
      description: 302 redirects to a 5-minute presigned S3 URL. Follow the redirect
        to download the gzipped tarball.
      tags:
        - facets
      parameters:
        - *a4
        - *a3
      responses:
        "302":
          description: Redirect to a 5-minute presigned S3 URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{name}/{version}/contents:
    get:
      operationId: getV0FacetsByNameByVersionContents
      summary: Get the verified files of a version
      description: Returns every verified file in the version except the manifest, as
        a path-sorted list. A text file carries its decoded UTF-8 content; a
        binary file carries only its fingerprint and byte size. A concrete
        public version is immutable and identical for every caller, so it is
        long-cacheable; a private version is `no-store` because each read is
        authorized at request time, as is a `latest` resolution.
      tags:
        - facets
      parameters:
        - *a4
        - *a3
      responses:
        "200":
          description: Verified files (text content and binary metadata)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentsResponse"
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/versions:
    post:
      operationId: postV0FacetsByScopeByNameVersions
      summary: Publish a new version of a scoped facet
      description: POST a gzipped tarball with `facet.json` at its root to
        `/@scope/name/versions`. The scope/facet separator MUST be a literal
        slash; `%2F` is rejected with `E_INVALID_NAME`. The caller MUST own the
        scope. The reconstructed `@scope/name` MUST equal the manifest `name`.
        Body is capped at 5 MB.
      tags:
        - facets
      security:
        - BearerAuth: []
      parameters:
        - *a1
        - *a2
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        "201": &a5
          description: Version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "202": &a6
          description: Queued for admin review (first-publish of a reserved or over-budget
            global facet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedForReviewBody"
        "401": &a7
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403": &a8
          description: Account suspended, name blocked, or caller does not own the
            publishing target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409": &a9
          description: Duplicate version, or another user has a pending claim for this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "413": &a10
          description: Tarball exceeds 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "422": &a11
          description: Tarball corrupt, manifest invalid, name grammar bad, or non-semver
            version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429": &a12
          description: Per-user pending queue cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{name}/versions:
    post:
      operationId: postV0FacetsByNameVersions
      summary: Publish a new version
      description: "POST a gzipped tarball with `facet.json` at its root. The registry
        validates the manifest (name grammar + semver), enforces ownership, then
        stores at a content-addressed S3 key and writes a FACET META + VERSION
        row. URL `name` MUST equal manifest `name`. Duplicate `name@version`
        returns 409 with `code: E_VERSION_EXISTS`. Body is capped at 5 MB."
      tags:
        - facets
      security:
        - BearerAuth: []
      parameters:
        - *a4
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        "201": *a5
        "202": *a6
        "401": *a7
        "403": *a8
        "409": *a9
        "413": *a10
        "422": *a11
        "429": *a12
  /v0/auth/sign-in:
    get:
      operationId: getV0AuthSignIn
      summary: Begin an interactive sign-in
      description: Redirects the browser to the identity provider to begin an
        authorization-code sign-in. The PKCE verifier and state are generated
        here and held in a short-lived signed cookie, so neither is ever exposed
        to page scripts. `web_origin` must exactly match one of the web origins
        configured for this stage; `return_to` is a path-only in-app
        destination.
      tags:
        - auth
      responses:
        "302":
          description: Redirect to the identity provider
        "403":
          description: Unconfigured web origin (E_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Interactive sign-in is not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/callback:
    get:
      operationId: getV0AuthCallback
      summary: Complete an interactive sign-in
      description: The identity provider redirects here with an authorization code.
        The API validates the signed transaction, exchanges the code, and issues
        the refresh credential as an HttpOnly cookie. It then redirects to the
        web application, carrying only the validated destination or a stable
        failure reason — never a code, state, or token.
      tags:
        - auth
      responses:
        "302":
          description: Redirect to the web application
        "503":
          description: Interactive sign-in is not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/cli/config:
    get:
      operationId: getV0AuthCliConfig
      summary: Get public CLI device authorization configuration
      description: Returns public, stage-bound WorkOS device authorization settings
        when CLI authentication is fully configured. Disabled stages expose only
        the selected provider.
      tags:
        - auth
      security: []
      responses:
        "200":
          description: CLI device authorization configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCliConfigResponse"
  /v0/auth/cli/logout:
    post:
      operationId: postV0AuthCliLogout
      summary: End the current CLI session
      description: Revokes refresh capability for only the verified WorkOS session
        attached to this bearer token. The issued access token remains valid
        until its short expiry. PAT callers must revoke the PAT by prefix
        instead.
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current CLI session refresh capability revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCliLogoutResponse"
        "400":
          description: PAT caller has no interactive session to revoke
            (E_LOGOUT_REQUIRES_JWT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid bearer credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Impersonated callers cannot revoke the target user session
            (E_IMPERSONATION_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: WorkOS is disabled or the session could not be revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/refresh:
    post:
      operationId: postV0AuthRefresh
      summary: Renew the browser session
      description: Issues a fresh short-lived access token from the refresh credential
        held in an HttpOnly cookie. Requires an allowlisted `Origin` and the
        browser-session marker header; the cookie alone is not sufficient. The
        response never contains the refresh credential. A rejected session
        withdraws the cookie; a registry or identity-provider failure leaves it
        in place so an outage is not mistaken for a sign-out. A suspended
        account renews normally — suspension blocks writes, not the session.
      tags:
        - auth
      responses:
        "200":
          description: A fresh access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "401":
          description: No usable session (E_UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Untrusted origin or missing marker (E_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: The session could not be renewed right now (E_REGISTRY_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/logout:
    post:
      operationId: postV0AuthLogout
      summary: Sign out (revoke refresh token)
      description: "Revokes the caller's refresh token at Cognito. A browser presents
        it as an HttpOnly cookie and must also send an allowlisted `Origin` and
        the browser-session marker header; the cookie is withdrawn once the
        outcome is terminal, including an already-invalid credential, and is
        kept when the outcome could not be established. Any other caller
        presents `refresh_token` in the request body, which is authenticated by
        the token itself, so the call succeeds even after the access token has
        locally expired. After this call, any currently-issued access token
        remains valid until its natural expiry but no new tokens can be obtained
        without re-authenticating. A suspended account may sign out: suspension
        blocks writes, not the ending of the caller's own session. PAT callers
        (CI tokens) should use `DELETE /v0/auth/tokens/:prefix` instead."
      tags:
        - auth
      responses:
        "200":
          description: Refresh token revoked
        "401":
          description: Refresh token invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Untrusted origin or missing marker (E_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: The session could not be ended right now (E_REGISTRY_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/me:
    get:
      operationId: getV0AuthMe
      summary: Get the authenticated user's profile
      description: "Returns the authenticated user's PROFILE projection: user_uuid,
        username, email, tier, and a boolean `suspended` derived from
        `suspended_at`. Available to suspended users (so the UI can render the
        suspension banner). `startup_experience` reports where this session may
        start — a derived destination, never runtime control state.
        `getting_started` reports availability and progress; `entry_required` is
        true only while the account has no presentation, skip, completion, or
        opt-out on record, and is confirmed against the authoritative account
        row before it is reported."
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: The account profile is corrupt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: The account’s getting-started state could not be read; retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/tokens:
    post:
      operationId: postV0AuthTokens
      summary: Mint a new personal access token
      description: 'Returns the plaintext token EXACTLY ONCE in the `plaintext_token`
        field. The registry stores only the HMAC of the secret portion. If you
        lose the plaintext, you must mint a new token. Up to 3 prefix-collision
        retries before returning 500 E_PREFIX_COLLISION_RETRY_EXHAUSTED.
        Requires an interactive (JWT) session — PAT callers receive 403
        E_INTERACTIVE_SESSION_REQUIRED. Impersonated (admin-as-target) sessions
        receive 403 E_IMPERSONATION_FORBIDDEN — stop impersonating before
        minting. Sending `source: "getting-started"` additionally records the
        account’s getting-started token milestone in the same transaction and
        attributes the `user.token_minted` event to the flow.'
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Token minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintTokenResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Account suspended, PAT caller (interactive session required), or
            impersonated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: Prefix collision retry exhausted (transient)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Event-sequence contention; retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
    get:
      operationId: getV0AuthTokens
      summary: List the caller's PATs
      description: Lists all (non-deleted) PATs minted by the authenticated user,
        including their revoke/expiry state.
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTokensResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/tokens/{prefix}:
    delete:
      operationId: deleteV0AuthTokensByPrefix
      summary: Revoke a PAT
      description: "Sets the token row's `revoked_at`. Guarded by `user_id = <self>`
        to prevent cross-user revocation. Idempotent: revoking an
        already-revoked token returns 200 (no error). Returns 404 if no such
        prefix exists for this user. Suspended users receive 403
        E_ACCOUNT_SUSPENDED."
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Token revoked (or already was)
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Account suspended (E_ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: No such token for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: prefix
          required: true
  /v0/auth/sign-out-everywhere:
    post:
      operationId: postV0AuthSignOutEverywhere
      summary: Sign out from all interactive sessions
      description: Invalidates all interactive sessions for the selected provider.
        WorkOS sign-out applies the registry's authentication cutoff and
        confirms that every listed WorkOS session was revoked before reporting
        success. Does NOT revoke PATs — use `GET /v0/auth/tokens` + per-prefix
        DELETE for that. PAT callers receive 400. Suspended users receive 403
        E_ACCOUNT_SUSPENDED.
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All interactive sessions invalidated
        "400":
          description: PAT caller (no Cognito session to invalidate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Account suspended (E_ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Global sign-out could not be confirmed (E_REGISTRY_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/auth/impersonation:
    delete:
      operationId: deleteV0AuthImpersonation
      summary: Stop impersonating
      description: Stateless no-op that returns 204. Impersonation holds no server
        state; the client stops by dropping the impersonation header and stored
        target metadata.
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Impersonation stopped
  /v0/onboarding/username:
    post:
      operationId: postV0OnboardingUsername
      summary: Bootstrap a new registry account (claim first username)
      description: For Cognito-authenticated callers who have NOT yet been provisioned
        in the registry. Creates the USERNAME reservation, the PROFILE row, the
        COGNITO_SUB reservation, and the user’s `@<username>` scope atomically.
        Returns 409 E_USERNAME_TAKEN if the username is already claimed, 403
        E_NAME_BLOCKED if the name is reserved or blocked. Usernames are
        immutable once set; this route runs exactly once per Cognito sub.
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: The requested name is reserved or permanently blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: Username already claimed OR this Cognito user already onboarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Verified email could not be obtained from the identity provider;
            retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/admin/overview:
    get:
      operationId: getV0AdminOverview
      summary: Admin overview (section/page status rollup)
      description: Raw per-page operational signals — pending review count, pending
        migrations, event-delivery health, read-only mode, control count — for
        the admin hub cards and rail/flyout status. Admin only.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Operational signal rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewResponse"
  /v0/admin/migrations:
    get:
      operationId: getV0AdminMigrations
      summary: List registered migrations (admin)
      description: Returns every migration in the code registry, each with a summary
        of its most recent run (if any).
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Migration list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationListResponse"
  /v0/admin/migrations/runs:
    get:
      operationId: getV0AdminMigrationsRuns
      summary: List all migration runs across every migration (admin)
      description: Aggregates the run history of every registered migration into one
        newest-first list. Gathered by server-side fan-out over the registry
        (one query per migration).
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All runs, newest-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationRunListResponse"
  /v0/admin/migrations/batches/latest-once:
    post:
      operationId: postV0AdminMigrationsBatchesLatestOnce
      summary: Start a "migrate to latest" batch (admin)
      description: Runs every pending one-time migration as a dry run followed by a
        real run, in dependency order, stopping on the first failure. Refuses to
        start if a migration or batch is already in progress.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationBatchResponse"
        "409":
          description: A migration or batch is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/admin/migrations/batches/{batchId}:
    get:
      operationId: getV0AdminMigrationsBatchesByBatchId
      summary: Get a migration batch (admin)
      description: "Returns a batch by id for polling: status, progress, and
        references to the current/failed run."
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Batch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationBatchResponse"
        "404":
          description: No such batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: batchId
          required: true
  /v0/admin/migrations/batches/{batchId}/cancel:
    post:
      operationId: postV0AdminMigrationsBatchesByBatchIdCancel
      summary: Cancel a running migration batch (admin)
      description: Marks the batch failed (cancelled), stops the orchestrator
        execution (live stages), and force-releases the global migration lease
        so a stopped run does not block migrations until its lease expires. A
        non-running batch returns its current state unchanged.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Batch cancelled (or already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationBatchResponse"
        "404":
          description: No such batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: batchId
          required: true
  /v0/admin/migrations/{id}/runs:
    post:
      operationId: postV0AdminMigrationsByIdRuns
      summary: Trigger a migration run (admin)
      description: Acquires the per-migration single-run lease, then starts the Step
        Functions execution. Pass dry_run=true to scan + count without writing.
        A real run (dry_run=false) requires the most recent run to be a
        succeeded dry run. Returns 404 if the id is unregistered, 409 if a run
        is already in progress or no succeeded dry run precedes a real run.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationRunResponse"
        "404":
          description: No such migration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: A run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
    get:
      operationId: getV0AdminMigrationsByIdRuns
      summary: List a migration’s runs (admin)
      description: Returns the run history for one migration, newest first.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationRunListResponse"
        "404":
          description: No such migration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
  /v0/admin/migrations/{id}/runs/{runId}:
    get:
      operationId: getV0AdminMigrationsByIdRunsByRunId
      summary: Get one migration run (admin)
      description: Returns a single run by run_id, including its per-record failure rows.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationRunResponse"
        "404":
          description: No such run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
        - schema:
            type: string
          in: path
          name: runId
          required: true
  /v0/admin/pilot-intake:
    get:
      operationId: getV0AdminPilotIntake
      summary: List pilot-intake submissions (admin)
      description: Newest-first. `cursor` continues a previous page; `limit` caps the
        page size.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: One page of submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotIntakeAdminListResponse"
        "400":
          description: Unusable cursor or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/admin/pilot-intake/{id}/review:
    post:
      operationId: postV0AdminPilotIntakeByIdReview
      summary: Record the Q08 human-read verdict (admin)
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Verdict recorded
        "404":
          description: No submission with that id (E_INTAKE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: Submission is not awaiting review (E_INTAKE_REVIEW_ALREADY_RECORDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotIntakeReviewRequest"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
    delete:
      operationId: deleteV0AdminPilotIntakeByIdReview
      summary: Reset a recorded Q08 verdict (admin)
      description: Returns the submission to awaiting review so a corrected verdict
        can be recorded.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Verdict cleared; the submission awaits review again
        "404":
          description: No submission with that id (E_INTAKE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: No recorded verdict to reset (E_INTAKE_REVIEW_NOT_RECORDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
  /v0/admin/reservation-list:
    get:
      operationId: getV0AdminReservationList
      summary: List all reservation-list entries (admin)
      description: Returns every reservation row across both pools, sorted by name.
        Scope-pool entries ('@'-prefixed) precede global-pool entries because
        '@' < 'a' in ASCII.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Reservation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
    post:
      operationId: postV0AdminReservationList
      summary: Add a reservation (admin)
      description: Adds a name to one pool ('scope' or 'global') or to every pool at
        once ('all'). The 'all' path uses TransactWriteItems for atomicity.
        Caller passes the BARE component name (without any '@' prefix); the
        registry prepends the prefix for the scope pool key. Returns 422 if the
        bare name fails the registry name grammar, 409 if any targeted pool
        already has the name reserved.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Reservation added
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: Already reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "422":
          description: Name fails registry grammar (E_INVALID_NAME)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
    delete:
      operationId: deleteV0AdminReservationList
      summary: Remove a reservation (admin)
      description: Removes one pool entry. Caller passes the BARE component name
        (without any '@' prefix). Does NOT propagate across pools — to remove
        from multiple pools, call this endpoint per pool. Returns 422 if the
        bare name fails the registry name grammar.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Reservation removed
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: No such reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "422":
          description: Name fails registry grammar (E_INVALID_NAME)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/admin/review-queue:
    get:
      operationId: getV0AdminReviewQueue
      parameters:
        - in: query
          name: status
          schema:
            enum:
              - approved
              - cancelled
              - pending
              - rejected
            default: pending
      summary: List review queue (admin)
      description: Returns QUEUE rows for the requested status bucket. Pending rows
        sort by GSI2SK (tier priority then created_at, oldest higher-tier
        first). Decided rows sort newest-decision first. The 'cancelled' bucket
        coalesces superseded + withdrawn rows; the row's own `status` field
        preserves the distinction. Default bucket is 'pending'. Includes the
        submitting user’s username and tier for display.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Items in the requested bucket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQueueListResponse"
        "400":
          description: Invalid status query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorBody"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/admin/review-queue/{id}:
    post:
      operationId: postV0AdminReviewQueueById
      summary: Approve or reject a pending queue item (admin)
      description: Approval of a global-facet first-publish transitions the QUEUE row
        to 'approved' AND writes the FACET META + VERSION rows atomically. If a
        parallel admin approval already won (the facet now exists), this user's
        queue row gets 'superseded' status instead. Rejection is a simple status
        transition.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQueueDecisionResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: No such queue item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "409":
          description: Item is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
  /v0/admin/users:
    get:
      operationId: getV0AdminUsers
      parameters:
        - in: query
          name: q
          schema:
            type: string
      summary: Search or browse users
      description: >-
        Bounded username search or database-backed directory browse.


        **Search mode** (default): an empty `q` browses all users alphabetically
        (match_all) and a non-empty `q` is an infix substring match over the
        OpenSearch users index; when OpenSearch fails the request 503s rather
        than silently degrading.


        **Browse mode** (`?browse=1`): walks all users alphabetically
        independent of search, using the database directly. If `q` is non-empty,
        browse is ignored and search takes precedence. Returns a `cursor` on
        non-terminal pages for pagination.


        Admin-gated, so the response carries email, tier, and suspension status.
        Suspended users are included in browse results as an admin directory
        view.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Matching or browsed users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "400":
          description: Invalid `q` query param, or an invalid browse cursor
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorBody"
                  - $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin (or caller is suspended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Search is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/admin/users/{id}/impersonation:
    post:
      operationId: postV0AdminUsersByIdImpersonation
      summary: Start impersonating a user
      description: Validates that the target exists and is not an admin, then returns
        the non-secret metadata the UI stores to drive impersonation. No token
        is minted — every subsequent request re-authorizes from the admin's live
        JWT plus the X-Facet-Impersonate-User-Id header.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Impersonation target validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartImpersonationResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin, or the target is an admin
            (E_IMPERSONATION_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Target user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
  /v0/admin/users/{id}/suspension:
    post:
      operationId: postV0AdminUsersByIdSuspension
      summary: Suspend a user
      description: "UpdateItem on the target user's PROFILE sets suspended_at,
        suspended_reason, and suspended_by_user_id. That row is the whole
        mechanism: it is read strongly-consistently at every write and admin
        operation, so the user's next write is refused regardless of the
        credential they present. No credential is revoked — the user keeps their
        sessions and CI publish tokens, continues to read, and may sign out of
        the session they are using."
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User suspended
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin (or caller is suspended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Target user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
    delete:
      operationId: deleteV0AdminUsersByIdSuspension
      summary: Lift a user's suspension
      description: REMOVEs suspended_at, suspended_reason, suspended_by_user_id from
        the PROFILE row. The user regains write access on their next request
        using the credentials they already hold — suspension revoked nothing.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Suspension lifted
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin (or caller is suspended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Target user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
  /v0/admin/orgs:
    get:
      operationId: getV0AdminOrgs
      parameters:
        - in: query
          name: q
          schema:
            type: string
      summary: Search or browse organizations
      description: >-
        Bounded organization search over the OpenSearch organizations index,
        returning org id, slug, and display name for admin autocomplete. An
        empty `q` browses all organizations alphabetically via OpenSearch
        match_all (capped); a non-empty `q` is a relevance-ranked match over
        display-name/description SUBSTRINGS. Requires search to be configured
        for the stage — organizations have no legacy prefix-queryable GSI, so
        search-mode 503s when search is unavailable rather than degrading.


        **Browse mode** (`?browse=1`): walks every organization alphabetically
        by SLUG PREFIX, straight from the database, independent of OpenSearch
        availability — the fallback for stages without search configured, or
        when search is down. Different match semantics than primary search: this
        orders and pages by slug, not by display-name/description relevance. If
        `q` is non-empty, browse is ignored and search takes precedence. Returns
        a `cursor` on non-terminal pages for pagination.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Matching or browsed organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrgListResponse"
        "400":
          description: Invalid `q` query param, or an invalid browse cursor
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorBody"
                  - $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Caller is not an admin (or caller is suspended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Search is unavailable or not configured (browse mode is unaffected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
