  /v0/settings/getting-started/progress:
    post:
      operationId: postV0SettingsGettingStartedProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    kind:
                      const: completed
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      const: opted_out
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      const: presented
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      const: reset
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      const: skipped
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      const: step
                    step:
                      enum:
                        - cli_signed_in
                        - facet_added
                  required:
                    - kind
                    - step
                  additionalProperties: false
      summary: Record a getting-started presentation, milestone, skip, finish,
        opt-out, or reset
      description: 'Records one getting-started fact on the caller’s account, at most
        once each: a repeat answers 200 with the unchanged progress and emits no
        second event. The token milestone is not markable here — it is recorded
        by the mint that creates the token (`POST /v0/auth/tokens` with `source:
        "getting-started"`). Finishing records completion without filling in
        milestones the user never confirmed. `presented` acknowledges that a
        setup screen rendered and completes no milestone or event. `reset`
        clears the account’s presentation, skip, finish, and opt-out records so
        the walkthrough is presented again, preserves the three setup milestones
        and their original times, emits `user.getting_started_reset`, and
        succeeds when repeated; it is refused with 403 E_FORBIDDEN while the
        flow is unavailable. This endpoint requires a direct interactive session
        — PAT callers receive 403 E_INTERACTIVE_SESSION_REQUIRED. Impersonated
        sessions receive 403 E_IMPERSONATION_FORBIDDEN; suspended accounts
        receive 403 E_ACCOUNT_SUSPENDED.'
      tags:
        - settings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The account’s committed getting-started progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkGettingStartedProgressResponse"
        "400":
          description: Unknown action or step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorBody"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Impersonated session, account suspended (E_ACCOUNT_SUSPENDED), PAT
            caller (E_INTERACTIVE_SESSION_REQUIRED), or a reset while the flow
            is unavailable (E_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: The account profile is corrupt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Event-sequence contention; retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
