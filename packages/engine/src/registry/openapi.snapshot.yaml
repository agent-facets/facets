paths:
  /v0/health:
    get:
      operationId: getV0Health
      summary: Liveness probe
      tags:
        - health
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v0/facets:
    get:
      operationId: getV0Facets
      summary: List or search facets
      description: Returns up to 200 published facets (FACET META rows). V0 ships
        without server-side `?q=` filtering — clients filter client-side.
        Pagination lands in alpha.
      tags:
        - facets
      responses:
        "200":
          description: List of facet summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /v0/facets/{scope}/{name}/latest-version:
    get:
      operationId: getV0FacetsByScopeByNameLatestVersion
      summary: Get the latest version pointer for a scoped facet
      description: Returns the current latest version string for a scoped facet.
        Short-cached.
      tags:
        - facets
      parameters:
        - &a1
          name: scope
          in: path
          required: true
          description: Scope name with the leading `@` (e.g. `@julian`).
          schema:
            type: string
            pattern: ^@[a-z][a-z0-9-]*[a-z0-9]$
        - &a2
          name: name
          in: path
          required: true
          description: Facet name within the scope (e.g. `cowsay`).
          schema:
            type: string
            pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
      responses:
        "200":
          description: Latest version pointer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestVersionResponse"
        "404":
          description: Facet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/versions/{version}:
    get:
      operationId: getV0FacetsByScopeByNameVersionsByVersion
      summary: Get the full version list for a scoped facet
      description: Returns the complete sorted version list for a scoped facet.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
        - &a3
          name: version
          in: path
          required: true
          description: Semver version (e.g., `1.2.3`) or the literal `latest`.
          schema:
            type: string
      responses:
        "200":
          description: Full version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionListResponse"
        "404":
          description: Facet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/{version}:
    get:
      operationId: getV0FacetsByScopeByNameByVersion
      summary: Get metadata for a specific version of a scoped facet
      description: Returns the version metadata for a scoped facet. The version may be
        `latest`.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
        - *a3
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionMetadata"
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/{version}/archive:
    get:
      operationId: getV0FacetsByScopeByNameByVersionArchive
      summary: Download a scoped facet version's tarball
      description: 302 redirects to a 5-minute presigned S3 URL.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
        - *a3
      responses:
        "302":
          description: Redirect to a 5-minute presigned S3 URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: Facet or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/facets/{scope}/{name}/{version}/contents:
    get:
      operationId: getV0FacetsByScopeByNameByVersionContents
      summary: Get the verified bodies of a scoped facet version's resources
      description: Returns the verified body of each skill, agent, and command in the
        scoped facet version.
      tags:
        - facets
      parameters:
        - *a1
        - *a2
