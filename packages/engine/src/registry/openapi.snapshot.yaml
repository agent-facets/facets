              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /v0/admin/event-health:
    get:
      operationId: getV0AdminEventHealth
      summary: Event delivery health
      description: "Product-event delivery health: pending backlog size,
        oldest-pending age, and the full unresolved dead-letter set. Admin
        only."
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Delivery-health surface
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDeliveryHealthResponse"
  /v0/admin/event-health/flush:
    post:
      operationId: postV0AdminEventHealthFlush
      summary: Trigger an analytics flush now
      description: Async-invokes the analytics flush Lambda to drain the raw archive
        into ClickHouse on demand. Admin only.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Flush started
  /v0/admin/event-health/resync:
    post:
      operationId: postV0AdminEventHealthResync
      summary: Reset the analytics flush watermark and resync
      description: Clears this stage's flush cursor under its lock and triggers a
        flush to reprocess the archive from the beginning. Admin only.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Resync started
        "409":
          description: A flush is in flight
  /v0/admin/event-health/rebuild:
    post:
      operationId: postV0AdminEventHealthRebuild
      summary: DROP and rebuild the analytics query store
      description: Async-invokes the flush Lambda to DROP and re-apply the shared
        ClickHouse schema (wiping all stages' rows) and reload this stage from
        the archive. Destructive. Admin only.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Rebuild accepted
  /v0/admin/event-health/redrive-dlq:
    post:
      operationId: postV0AdminEventHealthRedriveDlq
      summary: Redrive a consumer dead-letter queue
      description: Async-invokes the redrive Lambda to re-publish one consumer's
        dead-lettered events to the product bus for re-delivery. Per-consumer.
        Admin only.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Redrive started
        "400":
          description: Unknown consumer
        "409":
          description: Redrive not available for this consumer on this stage
  /v0/admin/search/backfill:
    post:
      operationId: postV0AdminSearchBackfill
      summary: Rebuild OpenSearch indexes from DynamoDB (admin)
      description: Full backfill of every search index for this stage prefix from
        authoritative DynamoDB. Returns per-subject scanned/indexed counts and
        count parity. A parity failure returns the same body with 500 and a
        populated `error`.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Per-subject backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchBackfillResponse"
        "500":
          description: Backfill ran but count parity failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchBackfillResponse"
  /v0/admin/search/replay-dead-letters:
    post:
      operationId: postV0AdminSearchReplayDeadLetters
      summary: Replay retained search index apply-failures (admin)
      description: Re-drives the search-indexer dead-letter partition back through the
        index path. Each row is re-hydrated from authoritative DynamoDB and
        high-water upserted (safe to rerun); a row that fails again is left in
        place and reported.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Per-row replay result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchReplayResponse"
  /v0/admin/search/verify:
    get:
      operationId: getV0AdminSearchVerify
      parameters:
        - in: query
          name: sample
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 5
      summary: Sampled DDB-vs-index correctness check (admin)
      description: Samples `?sample=` documents per subject (default 5, max 100) and
        diffs each against authoritative DynamoDB, reporting mismatched and
        missing ids. Any divergence returns the same body with 500 and a
        populated `error`.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Per-subject sampled-diff result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchVerifyResponse"
        "400":
          description: Invalid `sample` query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorBody"
        "500":
          description: Verify found DDB-vs-index divergence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchVerifyResponse"
  /v0/admin/search/indexes:
    get:
      operationId: getV0AdminSearchIndexes
      summary: List this stage’s search indexes with live health (admin)
      description: Current indexes for this stage prefix, each with live doc counts
        and cluster health from a single _cat/indices call, plus the last
        backfill/verify run times from the per-prefix meta row.
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Indexes with health and last-run times
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchIndexListResponse"
  /v0/admin/search/teardown:
    delete:
      operationId: deleteV0AdminSearchTeardown
      summary: Delete this stage’s search indexes (admin)
      description: "Deletes this stage’s indexes from the shared domain so orphaned
        preview-stage indexes can be purged without a local script. Only the
        calling stage’s indexes are touched. Idempotent: an absent index reports
        `existed: false`."
      tags:
        - admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Per-index deletion outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchTeardownResponse"
