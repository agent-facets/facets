      summary: Search organizations by name/slug prefix
      description: Bounded organization search over the OpenSearch organizations
        index, returning org id, slug, and display name for admin autocomplete.
        An empty `q` browses all organizations alphabetically (capped).
      tags:
        - admin
      security:
