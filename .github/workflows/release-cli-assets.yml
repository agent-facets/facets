name: Release attested CLI archives

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable agent-facets CLI release tag
        required: true
        type: string

concurrency:
  group: release-cli-assets-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish CLI archives
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            agent-facets@[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid CLI release tag: $TAG" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Confirm checkout matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked native prebuilds for all targets
        run: bun install --frozen-lockfile --os '*' --cpu '*' --ignore-scripts
      - name: Build CLI binaries
        run: bun scripts/release-cli/build.ts
      - name: Package CLI release assets
        run: bun scripts/release-cli/package-assets.ts
      - name: Stage and verify the release draft
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          FACET_RELEASE_PUBLISH: 'false'
          FACET_RELEASE_AUTH: workflow-token
          FACET_RELEASE_NOTIFY: 'false'
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-cli/upload-assets.ts
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: packages/cli/dist/release-assets/checksums.txt
      - name: Verify archive provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd packages/cli/dist/release-assets
          while IFS='  ' read -r digest asset; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-cli-assets.yml" \
              --source-ref "refs/tags/$TAG"
          done < checksums.txt
      - name: Publish the attested release draft
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          FACET_RELEASE_AUTH: workflow-token
          FACET_RELEASE_NOTIFY: 'false'
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-cli/upload-assets.ts
