pre-commit:
  piped: true
  commands:
    check-bun-version:
      priority: 1
      run: bun scripts/check-bun-version.ts
    biome-format:
      priority: 2
      glob: "*.{ts,js,json}"
      # Keep in sync with `files.includes` ignores in biome.json — passing an
      # ignored file as the only argument makes biome exit 1 with
      # "No files were processed".
      exclude:
        - "**/generated/**"
        - "openspec/changes/archive/**"
      run: bun biome check --write --unsafe {staged_files}
      stage_fixed: true
    biome-lint:
      priority: 3
      glob: "*.{ts,js,json}"
      exclude:
        - "**/generated/**"
        - "openspec/changes/archive/**"
      run: bun biome check --error-on-warnings {staged_files}
    circleci-pack:
      priority: 4
      glob: ".circleci/{development,release}/**/*.yml"
      run: bun run ci:pack && git add .circleci/development.yml .circleci/release.yml

pre-push:
  commands:
    check:
      run: bun check
